name: Gerar 2 APKs - Monitor e Central

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 7.6.4 e Configurar Android SDK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o commandlinetools.zip
          unzip -q commandlinetools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          rm -rf commandlinetools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 4. Organizar ficheiros e preparar estrutura do projeto
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/example/monitordados
          mkdir -p APKs-Prontos

          # Procura index.html, central.html e MainActivity.java em qualquer pasta (ignorando maiúsculas/minúsculas)
          FOUND_INDEX=$(find . -maxdepth 4 -iname "index.html" | head -n 1)
          if [ -n "$FOUND_INDEX" ] && [ "$FOUND_INDEX" != "./app/src/main/assets/index.html" ]; then
            cp "$FOUND_INDEX" app/src/main/assets/index.html
          fi

          FOUND_CENTRAL=$(find . -maxdepth 4 -iname "central.html" | head -n 1)
          if [ -n "$FOUND_CENTRAL" ] && [ "$FOUND_CENTRAL" != "./app/src/main/assets/central.html" ]; then
            cp "$FOUND_CENTRAL" app/src/main/assets/central.html
          fi

          FOUND_JAVA=$(find . -maxdepth 6 -iname "*MainActivity*.java" | head -n 1)
          if [ -n "$FOUND_JAVA" ] && [ "$FOUND_JAVA" != "./app/src/main/java/com/example/monitordados/MainActivity.java" ]; then
            cp "$FOUND_JAVA" app/src/main/java/com/example/monitordados/MainActivity.java
          fi

          # Garante que o AndroidManifest.xml existe sempre no caminho exato
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.example.monitordados">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:label="Monitor de Dados"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service android:name=".MainActivity$MonitorSempreAtivoService" android:enabled="true" android:exported="false" />

                  <service
                      android:name=".MainActivity$FirewallVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <receiver android:name=".MainActivity$BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          echo "sdk.dir=$HOME/android-sdk" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorFrota"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.monitordados'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: 5. Compilar APK 1 - Monitor de Dados
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Monitor-Dados.apk

      - name: 6. Compilar APK 2 - Painel Central
        run: |
          if [ -f "app/src/main/assets/central.html" ]; then
            cp app/src/main/assets/central.html app/src/main/assets/index.html
          fi

          sed -i 's/applicationId "com.example.monitordados"/applicationId "com.example.painelcentral"/g' app/build.gradle
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/src/main/AndroidManifest.xml

          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Painel-Central.apk

      - name: 7. Publicar os 2 APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Monitor-e-Central
          path: APKs-Prontos/*.apk
