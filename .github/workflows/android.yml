
name: Gerar 2 APKs - Monitor e Central

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 7.6.4 e Configurar Android SDK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o commandlinetools.zip
          unzip -q commandlinetools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          rm -rf commandlinetools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 4. Organizar Ficheiros e assets (Monitor de Dados)
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/example/monitordados
          mkdir -p APKs-Prontos

          # Tenta encontrar qualquer HTML na raiz ou subpastas e copia para index.html
          FOUND_HTML=$(find . -maxdepth 3 -name "*.html" | grep -v "central" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            cp "$FOUND_HTML" app/src/main/assets/index.html
          fi

          # Se ainda assim não existir o index.html, cria um painel básico de emergência para não dar erro
          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo '<!DOCTYPE html><html><body><h1>Monitor de Dados - Ativo</h1></body></html>' > app/src/main/assets/index.html
          fi

          echo "sdk.dir=$HOME/android-sdk" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MonitorFrota"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '7.4.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.monitordados'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 23
                  targetSdk 33
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { debug { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: 5. Compilar APK 1 - Monitor de Dados
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Monitor-Dados.apk

      - name: 6. Compilar APK 2 - Painel Central
        run: |
          # Tenta encontrar o ficheiro central.html ou qualquer outro HTML para a Central
          FOUND_CENTRAL=$(find . -maxdepth 3 -iname "*central*.html" | head -n 1)
          if [ -n "$FOUND_CENTRAL" ]; then
            cp "$FOUND_CENTRAL" app/src/main/assets/index.html
          else
            FOUND_ANY=$(find . -maxdepth 3 -name "*.html" | head -n 1)
            if [ -n "$FOUND_ANY" ]; then
              cp "$FOUND_ANY" app/src/main/assets/index.html
            else
              echo '<!DOCTYPE html><html><body><h1>Painel Central - Ativo</h1></body></html>' > app/src/main/assets/index.html
            fi
          fi

          sed -i 's/applicationId "com.example.monitordados"/applicationId "com.example.painelcentral"/g' app/build.gradle
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/src/main/AndroidManifest.xml

          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Painel-Central.apk

      - name: 7. Publicar os 2 APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Monitor-e-Central
          path: APKs-Prontos/*.apk
