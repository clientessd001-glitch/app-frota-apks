              var clientMqtt = null;

              var planoGB = parseFloat(lerDado('planoGB', '0')) || 0;
              var diaCiclo = parseInt(lerDado('diaCiclo', '1'), 10) || 1;
              var offsetZeroGB = parseFloat(lerDado('offsetZeroGB', '0')) || 0;
              var firewallGeralAtivo = lerDado('firewallGeral_v7', 'false') === 'true';
              var appsBloqueadosMap = {};
              try { appsBloqueadosMap = JSON.parse(lerDado('appsBloqueados_v7', '{}')) || {}; } catch (e) { appsBloqueadosMap = {}; }

