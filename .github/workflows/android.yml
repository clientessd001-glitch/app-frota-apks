              function temPonteAndroid() { return typeof window.AndroidMonitor !== 'undefined'; }
              function abrirPermissaoUso() { if (temPonteAndroid() && window.AndroidMonitor.solicitarPermissaoUso) { window.AndroidMonitor.solicitarPermissaoUso(); } }
              function abrirPermissaoVpn() { if (temPonteAndroid() && window.AndroidMonitor.solicitarPermissaoVpn) { window.AndroidMonitor.solicitarPermissaoVpn(); } }

              function appEstaBloqueado(pacote) {
                if (firewallGeralAtivo) return true;
                return Boolean(appsBloqueadosMap[pacote]);
              }

              function atualizarInterfaceFirewall() {
                var banner = document.getElementById('bannerFirewall');
                var txtBanner = document.getElementById('textoBannerFirewall');
                var badgeTopo = document.getElementById('badgeRedeTopo');
                var pacotesBloq = Object.keys(appsBloqueadosMap).filter(function(k) { return appsBloqueadosMap[k]; });

                if (temPonteAndroid() && window.AndroidMonitor.sincronizarFirewallVpn) {
                  try { window.AndroidMonitor.sincronizarFirewallVpn(firewallGeralAtivo, JSON.stringify(pacotesBloq)); } catch (e) {}
                }

                if (firewallGeralAtivo) {
                  banner.style.display = 'block';
                  txtBanner.textContent = 'Todos os aplicativos deste aparelho estao com acesso a internet bloqueado pela Central.';
                  badgeTopo.textContent = '🛡️ Apps Bloqueados';
                  badgeTopo.classList.add('off');
                } else if (pacotesBloq.length > 0) {
                  banner.style.display = 'block';
                  txtBanner.textContent = pacotesBloq.length + ' aplicativo(s) com acesso a internet bloqueado pela Central.';
                  badgeTopo.classList.remove('off');
                } else {
                  banner.style.display = 'none';
                  badgeTopo.classList.remove('off');
                }
                atualizarPainelLocal();
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
                enviarPacoteAutomatico();
              }

              function salvarConfiguracoes() {
                diaCiclo = Math.max(1, Math.min(28, parseInt(document.getElementById('inputDiaCiclo').value || '1', 10) || 1));
                document.getElementById('inputDiaCiclo').value = String(diaCiclo);
                destacarBotoesPlanoLocal();
                salvarDado('planoGB', planoGB);
                salvarDado('diaCiclo', diaCiclo);
                atualizarPainelLocal();
                carregarAppsInstalados();
                enviarPacoteAutomatico();
              }

              function zerarContadorManual() {
                offsetZeroGB = ultimoConsumoBrutoGB;
                salvarDado('offsetZeroGB', offsetZeroGB);
                atualizarPainelLocal();
                enviarPacoteAutomatico();
              }

              function atualizarPainelLocal() {
                destacarBotoesPlanoLocal();
                if (temPonteAndroid()) {
                  try {
                    var permitidoUso = window.AndroidMonitor.temPermissaoUso();
                    var permitidoVpn = window.AndroidMonitor.temPermissaoVpn ? window.AndroidMonitor.temPermissaoVpn() : true;
                    document.getElementById('boxPermissao').style.display = (permitidoUso && permitidoVpn) ? 'none' : 'block';
                    document.getElementById('btnPermUso').style.display = permitidoUso ? 'none' : 'block';
                    document.getElementById('btnPermVpn').style.display = permitidoVpn ? 'none' : 'block';

                    ultimoConsumoBrutoGB = window.AndroidMonitor.obterConsumoTotalMesGB(diaCiclo) || 0;
                    estadoLocal.rede = window.AndroidMonitor.obterTipoRede() || 'Dados Moveis';
                    estadoLocal.velocidade = window.AndroidMonitor.obterVelocidadeMbps() || 0;
                    estadoLocal.latencia = window.AndroidMonitor.obterLatenciaMs() || 0;
                    window.AndroidMonitor.dispararMedicaoEmSegundoPlano();
                  } catch (e) {}
                } else {
                  if (ultimoConsumoBrutoGB === 0) {
                    ultimoConsumoBrutoGB = parseFloat(lerDado('simConsumoGB_v6', '4.25')) || 4.25;
                  }
                }

                var consumoLiquido = Math.max(0, ultimoConsumoBrutoGB - offsetZeroGB);
                var redeMostrada = firewallGeralAtivo ? '🛡️ Firewall Ativo (Apps Bloqueados)' : estadoLocal.rede;
                var velMostrada = firewallGeralAtivo ? 0 : Number(estadoLocal.velocidade);

                if (!firewallGeralAtivo) { document.getElementById('badgeRedeTopo').textContent = '🟢 ' + estadoLocal.rede; }
                document.getElementById('geoRedeAtiva').textContent = redeMostrada;
                document.getElementById('valorConsumoGB').textContent = consumoLiquido.toFixed(2) + ' GB';
                document.getElementById('valVelocidade').textContent = velMostrada.toFixed(2) + ' Mbps';
                document.getElementById('valLatencia').textContent = firewallGeralAtivo ? 'Bloqueado' : ((estadoLocal.latencia > 0 ? estadoLocal.latencia : 22) + ' ms');

                var barra = document.getElementById('barraProgresso');
                var alerta = document.getElementById('alertaFranquia');

                if (planoGB === 0) {
                  document.getElementById('labelPlanoAtivo').textContent = '♾️ Plano Ilimitado';
                  document.getElementById('textoStatusFranquia').textContent = 'Uso Livre Ilimitado • Renovacao dia ' + diaCiclo;
                  barra.style.width = '100%';
                  alerta.style.display = 'none';
                } else {
                  var pct = Math.min(100, (consumoLiquido / planoGB) * 100);
                  var restante = Math.max(0, planoGB - consumoLiquido);
                  document.getElementById('labelPlanoAtivo').textContent = 'Franquia ' + planoGB + ' GB';
                  document.getElementById('textoStatusFranquia').textContent = pct.toFixed(1) + '% usado • Restam ' + restante.toFixed(2) + ' GB (Dia ' + diaCiclo + ')';
                  barra.style.width = pct + '%';
                  alerta.style.display = pct >= 80 ? 'block' : 'none';
                  alerta.style.background = pct >= 90 ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)';
                  alerta.style.color = pct >= 90 ? '#f87171' : '#fbbf24';
                  alerta.textContent = pct >= 90 ? '🚨 Alerta: 90% da franquia usada!' : '⚠️ Alerta: 80% da franquia usada.';
                }
              }

              function atualizarGeolocalizacaoRede() {
                document.getElementById('geoCidade').textContent = estadoLocal.cidade;
                document.getElementById('geoOperadora').textContent = estadoLocal.operadora;
                document.getElementById('geoCoordenadas').textContent = estadoLocal.lat.toFixed(4) + ', ' + estadoLocal.lon.toFixed(4);

                if (temPonteAndroid() && window.AndroidMonitor.obterInfoRedeEGeoJSON) {
                  try {
                    var info = JSON.parse(window.AndroidMonitor.obterInfoRedeEGeoJSON());
                    if (info.operadora) { estadoLocal.operadora = info.operadora; document.getElementById('geoOperadora').textContent = info.operadora; }
                    if (info.latitude && info.longitude && (info.latitude !== 0 || info.longitude !== 0)) {
                      estadoLocal.lat = info.latitude; estadoLocal.lon = info.longitude;
                      document.getElementById('geoCoordenadas').textContent = info.latitude.toFixed(4) + ', ' + info.longitude.toFixed(4);
                    }
                  } catch (e) {}
                }

                if (navigator.geolocation) {
                  navigator.geolocation.getCurrentPosition(function(pos) {
                    if (pos && pos.coords) {
                      estadoLocal.lat = pos.coords.latitude;
                      estadoLocal.lon = pos.coords.longitude;
                      document.getElementById('geoCoordenadas').textContent = estadoLocal.lat.toFixed(4) + ', ' + estadoLocal.lon.toFixed(4);
                    }
                  }, function() {}, { enableHighAccuracy: true, timeout: 8000 });
                }
              }

              function carregarAppsInstalados() {
                if (temPonteAndroid() && window.AndroidMonitor.obterAppsInstaladosJSON) {
                  try {
                    var raw = window.AndroidMonitor.obterAppsInstaladosJSON(diaCiclo);
                    cacheApps = JSON.parse(raw || '[]');
                  } catch (e) { cacheApps = []; }
                }
                if (!cacheApps || cacheApps.length === 0) {
                  cacheApps = [
                    { nome: 'WhatsApp', pacote: 'com.whatsapp', totalMB: 840.5, redeAtiva: 'Transmitindo (4G)', emTransmissao: true, usaGeo: true, geoAtiva: true },
                    { nome: 'Instagram', pacote: 'com.instagram.android', totalMB: 1250.2, redeAtiva: 'Transmitindo (4G)', emTransmissao: true, usaGeo: true, geoAtiva: true }
                  ];
                }
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
              }

              function definirFiltroApps(filtro) {
                filtroAtualApps = filtro;
                document.getElementById('f-todos').classList.toggle('ativo', filtro === 'todos');
                document.getElementById('f-geo').classList.toggle('ativo', filtro === 'geo');
                document.getElementById('f-rede').classList.toggle('ativo', filtro === 'rede');
                document.getElementById('f-bloq').classList.toggle('ativo', filtro === 'bloq');
                renderizarListaApps(cacheApps, filtroAtualApps, 'listaAppsContainer', 'contadorApps');
              }

              function renderizarListaApps(listaBase, filtro, containerId, contadorId) {
                var container = document.getElementById(containerId);
                var filtrados = (listaBase || []).map(function(a) {
                  var bloq = appEstaBloqueado(a.pacote);
                  return { nome: a.nome, pacote: a.pacote, totalMB: a.totalMB, redeAtiva: bloq ? 'Internet Bloqueada' : a.redeAtiva, emTransmissao: bloq ? false : a.emTransmissao, usaGeo: a.usaGeo, geoAtiva: a.geoAtiva, bloqueado: bloq };
                });

                if (filtro === 'geo') { filtrados = filtrados.filter(function(a) { return a.usaGeo; }); }
                else if (filtro === 'rede') { filtrados = filtrados.filter(function(a) { return !a.bloqueado && a.emTransmissao; }); }
                else if (filtro === 'bloq') { filtrados = filtrados.filter(function(a) { return a.bloqueado; }); }

                document.getElementById(contadorId).textContent = filtrados.length + ' apps';
                if (filtrados.length === 0) { container.innerHTML = '<div class="sub-info">Nenhum aplicativo listado neste filtro.</div>'; return; }

                container.innerHTML = filtrados.map(function(app) {
                  var badgeRede = app.bloqueado ? '<span class="tag tag-net-block">🚫 Bloqueado</span>' : (app.emTransmissao ? '<span class="tag tag-net-on">🟢 Ativo</span>' : '<span class="tag tag-net-idle">📶 Conectado</span>');
                  var badgeGeo = app.usaGeo ? (app.geoAtiva ? '<span class="tag tag-geo-on">📍 GPS</span>' : '<span class="tag tag-geo-off">🔒 S/ GPS</span>') : '';
                  var mb = Number(app.totalMB || 0);
                  var valorFormatado = mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(1) + ' MB';
                  return '<div class="app-item ' + (app.bloqueado ? 'app-bloqueado' : '') + '">' +
                    '<div class="app-main"><div class="app-nome">' + app.nome + '</div><div class="app-pkg">' + app.pacote + '</div><div class="app-badges">' + badgeRede + ' ' + badgeGeo + '</div></div>' +
                    '<div class="app-consumo">' + valorFormatado + '</div></div>';
                }).join('');
              }

              function iniciarConexaoNuvem() {
                try {
                  if (typeof mqtt !== 'undefined') {
                    clientMqtt = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'mon_' + deviceId + '_' + Math.floor(Math.random() * 9999), clean: true, reconnectPeriod: 3000 });
                    clientMqtt.on('connect', function() {
                      document.getElementById('statusNuvemTopo').textContent = '☁️ Sincronizado • ID: ' + deviceId;
                      clientMqtt.subscribe(PREFIXO_CMD + deviceId, { qos: 0 });
                      enviarPacoteAutomatico();
                    });
                    clientMqtt.on('message', function(topic, message) {
                      try {
                        var cmd = JSON.parse(message.toString());
                        if (!cmd) return;
                        if (cmd.acao === 'FIREWALL_GERAL' || cmd.acao === 'DESLIGAR_DADOS' || cmd.acao === 'RELIGAR_DADOS') {
                          firewallGeralAtivo = (cmd.acao === 'DESLIGAR_DADOS' || Boolean(cmd.bloquear));
                          salvarDado('firewallGeral_v7', firewallGeralAtivo ? 'true' : 'false');
                          atualizarInterfaceFirewall();
                        }
                        if (cmd.acao === 'FIREWALL_APP' && cmd.pacote) {
                          if (cmd.bloquear) { appsBloqueadosMap[cmd.pacote] = true; } else { delete appsBloqueadosMap[cmd.pacote]; }
                          salvarDado('appsBloqueados_v7', JSON.stringify(appsBloqueadosMap));
                          atualizarInterfaceFirewall();
                        }
                        if (cmd.acao === 'CONFIG_PLANO') {
                          if (cmd.planoGB !== undefined) {
                            planoGB = parseFloat(cmd.planoGB) || 0;
                            salvarDado('planoGB', planoGB);
                            destacarBotoesPlanoLocal();
                          }
                          if (cmd.diaCiclo !== undefined) {
                            diaCiclo = Math.max(1, Math.min(28, parseInt(cmd.diaCiclo, 10) || 1));
                            salvarDado('diaCiclo', diaCiclo);
                            document.getElementById('inputDiaCiclo').value = String(diaCiclo);
                          }
                          if (cmd.zerarHoje) {
                            offsetZeroGB = ultimoConsumoBrutoGB;
                            salvarDado('offsetZeroGB', offsetZeroGB);
                          }
                          atualizarPainelLocal();
                          carregarAppsInstalados();
                          enviarPacoteAutomatico();
                        }
                        if (cmd.acao === 'ZERAR_CONTADOR') {
                          zerarContadorManual();
                        }
                      } catch (e) {}
                    });
                  }
                } catch (e) {}
              }

              function enviarPacoteAutomatico() {
                var consumoLiquido = Math.max(0, ultimoConsumoBrutoGB - offsetZeroGB);
                var appsCompactados = (cacheApps || []).slice(0, 15).map(function(a) {
                  var bloq = appEstaBloqueado(a.pacote);
                  return { nome: a.nome, pacote: a.pacote, totalMB: Number(Number(a.totalMB || 0).toFixed(1)), redeAtiva: bloq ? '🚫 Bloqueado' : a.redeAtiva, emTransmissao: !bloq && a.emTransmissao, usaGeo: a.usaGeo, geoAtiva: a.geoAtiva, bloqueado: bloq };
                });

                var pacote = {
                  deviceId: deviceId, nome: nomeAparelho, timestamp: Date.now(), consumoGB: Number(consumoLiquido.toFixed(2)),
                  planoGB: planoGB, diaCiclo: diaCiclo, rede: firewallGeralAtivo ? '🛡️ Apps Bloqueados' : estadoLocal.rede, dadosDesligados: firewallGeralAtivo,
                  appsBloqueadosMap: appsBloqueadosMap, velocidade: firewallGeralAtivo ? 0 : Number(Number(estadoLocal.velocidade || 0).toFixed(1)),
                  latencia: firewallGeralAtivo ? 0 : estadoLocal.latencia, cidade: estadoLocal.cidade, operadora: estadoLocal.operadora,
                  lat: Number(Number(estadoLocal.lat || -3.7361).toFixed(5)), lon: Number(Number(estadoLocal.lon || -38.6531).toFixed(5)), apps: appsCompactados
                };

                if (clientMqtt && clientMqtt.connected) {
                  clientMqtt.publish(PREFIXO_MQTT + deviceId, JSON.stringify(pacote), { qos: 0, retain: true });
                  document.getElementById('statusNuvemTopo').textContent = '☁️ Sincronizado • ID: ' + deviceId;
                }
              }

              destacarBotoesPlanoLocal();
              carregarAppsInstalados();
              atualizarGeolocalizacaoRede();
              atualizarInterfaceFirewall();
              iniciarConexaoNuvem();
              setTimeout(enviarPacoteAutomatico, 1000);
              setInterval(enviarPacoteAutomatico, 8000);
              setInterval(atualizarPainelLocal, 3000);
              setInterval(carregarAppsInstalados, 8000);
              setInterval(atualizarGeolocalizacaoRede, 15000);
            </script>
          </body>
          </html>
          EOF

          # ===================================================================
          # 4. CENTRAL.HTML COMPLETO (APP 2 - BOTOES DIRETOS DE PLANO E CICLO)
          # ===================================================================
          cat << 'EOF' > app/src/main/assets/central.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Central de Monitoramento</title>
            <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
            <style>
              :root {
                --bg: #0b1120; --card: #151f32; --card-dark: #0f172a; --border: #263554;
                --primary: #38bdf8; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
                --text: #f8fafc; --muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
              body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 40px; }
              .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
              .header h1 { font-size: 1.15rem; color: var(--primary); }
              .badge-rede { background: rgba(34,197,94,0.18); color: var(--success); border: 1px solid var(--success); padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
              .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
              .card-title { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
              .sub-info { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }
              .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
              .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
              .planos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; margin-bottom: 10px; }
              .plano-chip { padding: 10px 6px; border-radius: 8px; border: 1px solid var(--border); background: #151f32; color: var(--muted); font-size: 0.82rem; font-weight: 700; text-align: center; cursor: pointer; margin-top: 0; }
              .plano-chip.ativo { background: var(--primary); color: #082f49; border-color: var(--primary); }
              .ciclo-ctrl { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
              .ciclo-btn { width: 44px; padding: 10px 0; font-size: 1.05rem; font-weight: 800; margin-top: 0; background: #1e293b; color: var(--text); border: 1px solid var(--border); }
              .metric-box { background: var(--card-dark); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
              .metric-label { font-size: 0.72rem; color: var(--muted); }
              .metric-val { font-size: 1rem; font-weight: 700; margin-top: 3px; color: var(--text); }
              input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-dark); color: var(--text); font-size: 0.88rem; margin-top: 6px; }
              button { font-weight: 700; cursor: pointer; }
              button.btn-primary { background: var(--primary); color: #082f49; border: none; }
              button.btn-sec { background: #1e293b; color: var(--text); }
              button.btn-danger { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid var(--danger); }
              button.btn-success { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid var(--success); }
              .filtros-apps { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
              .filtro-btn { width: auto; padding: 6px 12px; font-size: 0.75rem; border-radius: 999px; background: var(--card-dark); color: var(--muted); border: 1px solid var(--border); margin-top: 0; white-space: nowrap; }
              .filtro-btn.ativo { background: var(--primary); color: #082f49; border-color: var(--primary); }
              .app-list { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
              .app-item { background: var(--card-dark); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
              .app-item.app-bloqueado { border-color: var(--danger); background: rgba(239,68,68,0.08); }
              .app-main { flex: 1; min-width: 0; }
              .app-nome { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .app-pkg { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .app-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
              .tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 6px; font-weight: 600; display: inline-block; }
              .tag-net-on { background: rgba(34,197,94,0.2); color: #4ade80; }
              .tag-net-block { background: rgba(239,68,68,0.25); color: #f87171; border: 1px solid var(--danger); }
              .tag-geo-on { background: rgba(245,158,11,0.2); color: #fbbf24; }
              .app-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
              .app-consumo { font-weight: 800; font-size: 0.88rem; color: var(--primary); white-space: nowrap; }
              .btn-app-lock { width: auto; padding: 4px 10px; font-size: 0.72rem; border-radius: 6px; margin-top: 0; white-space: nowrap; }
              .device-card { background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
              .device-card.bloqueado { border-color: var(--danger); }
              .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
              .device-name { font-size: 1rem; font-weight: 800; color: var(--text); }
              .status-dot { font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
              .status-online { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid var(--success); }
              .status-offline { background: rgba(148,163,184,0.15); color: var(--muted); border: 1px solid var(--border); }
              .status-blocked { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid var(--danger); }
              .device-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
              .device-actions button { padding: 8px; font-size: 0.8rem; margin-top: 0; }
              .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 1000; padding: 12px; overflow-y: auto; }
              .modal-box { background: var(--card); border: 1px solid var(--primary); border-radius: 14px; padding: 14px; max-width: 600px; margin: 10px auto; }
              .config-remota-box { background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>🖥️ Central de Monitoramento</h1>
              <span id="statusCentral" class="badge-rede">🟢 Conectando...</span>
            </div>

            <div class="grid-4">
              <div class="metric-box"><div class="metric-label">Aparelhos</div><div class="metric-val" id="resumoTotalAparelhos">0</div></div>
              <div class="metric-box"><div class="metric-label">Online</div><div class="metric-val" id="resumoOnlineAgora" style="color: var(--success);">0</div></div>
              <div class="metric-box"><div class="metric-label">Consumo Total</div><div class="metric-val" id="resumoConsumoFrota" style="color: var(--primary);">0.00 GB</div></div>
              <div class="metric-box"><div class="metric-label">Com GPS</div><div class="metric-val" id="resumoComGps" style="color: var(--warning);">0</div></div>
            </div>

            <div class="card">
              <div class="card-title">
                <span>📲 Aparelhos Conectados</span>
                <div style="display:flex; gap:6px;">
                  <button class="filtro-btn ativo" onclick="simularAparelhoExtra()">🧪 Simular +1</button>
                  <button class="filtro-btn" onclick="reconectarTudo()">🔄 Atualizar</button>
                  <button class="filtro-btn" onclick="limparListaCentral()">🗑️ Limpar</button>
                </div>
              </div>
              <div id="listaFrotaContainer"><div class="sub-info">Escutando aparelhos em tempo real...</div></div>
            </div>

            <div id="modalAparelhoRemoto" class="modal-overlay">
              <div class="modal-box">
                <div class="card-title">
                  <span id="modalTituloAparelho" style="color:var(--primary); font-size:0.95rem;">Detalhes do Aparelho</span>
                  <button class="filtro-btn" onclick="fecharModalRemoto()">✖ Fechar</button>
                </div>

                <div class="grid-2" style="margin-bottom: 10px;">
                  <div class="metric-box"><div class="metric-label">Consumo / Plano</div><div class="metric-val" id="modalConsumoPlano" style="font-size:0.9rem;">--</div></div>
                  <div class="metric-box"><div class="metric-label">Rede Ativa / Ping</div><div class="metric-val" id="modalRedePing" style="font-size:0.88rem;">--</div></div>
                  <div class="metric-box"><div class="metric-label">Localizacao / Cidade</div><div class="metric-val" id="modalCidadeOp" style="font-size:0.85rem;">--</div></div>
                  <div class="metric-box"><div class="metric-label">Coordenadas GPS</div><div class="metric-val" id="modalCoordsGps" style="font-size:0.82rem;">--</div></div>
                </div>

                <div class="config-remota-box">
                  <div class="card-title" style="margin-bottom: 6px;">
                    <span>⚙️ Escolher Plano e Ciclo do Aparelho</span>
                    <span id="statusSalvoRemoto" style="color:var(--success); font-size:0.75rem; font-weight:700;"></span>
                  </div>
                  <label class="metric-label">Toque no Plano Desejado:</label>
                  <div class="planos-grid">
                    <button type="button" class="plano-chip" id="mPlano-0" onclick="selecionarPlanoRemotoUI(0)" style="grid-column: span 2;">♾️ Ilimitado</button>
                    <button type="button" class="plano-chip" id="mPlano-43" onclick="selecionarPlanoRemotoUI(43)">43 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-48" onclick="selecionarPlanoRemotoUI(48)">48 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-91" onclick="selecionarPlanoRemotoUI(91)">91 GB</button>
                    <button type="button" class="plano-chip" id="mPlano-134" onclick="selecionarPlanoRemotoUI(134)">134 GB</button>
                  </div>

                  <label class="metric-label">Dia de Renovacao do Ciclo (1 a 28):</label>
                  <div class="ciclo-ctrl">
                    <button type="button" class="ciclo-btn" onclick="ajustarDiaRemotoUI(-1)">-</button>
                    <input type="number" id="modalInputDiaCiclo" min="1" max="28" value="1" style="margin-top:0; text-align:center; font-weight:700;" />
                    <button type="button" class="ciclo-btn" onclick="ajustarDiaRemotoUI(1)">+</button>
                  </div>

                  <div class="grid-2" style="margin-top: 10px;">
                    <button type="button" class="btn-primary" style="margin-top:0;" onclick="salvarPlanoCicloRemoto()">💾 Salvar no Aparelho</button>
                    <button type="button" class="btn-sec" style="margin-top:0;" onclick="zerarContadorRemoto()">🔄 Zerar Contador Hoje</button>
                  </div>
                </div>

                <div class="grid-2" style="margin-bottom: 12px;">
                  <button id="btnAbrirMapaModal" class="btn-sec" style="margin-top:0;">🗺️ Abrir no Mapa</button>
                  <button id="btnToggleDadosModal" class="btn-danger" style="margin-top:0;">🛡️ Bloquear Todos</button>
                </div>

                <div class="card-title">
                  <span>📱 Controle de Internet por Aplicativo</span>
                  <span id="modalContadorApps">0 apps</span>
                </div>
                <div class="filtros-apps">
                  <button class="filtro-btn ativo" id="mf-todos" onclick="filtrarAppsRemoto('todos')">Todos</button>
                  <button class="filtro-btn" id="mf-geo" onclick="filtrarAppsRemoto('geo')">📍 Com GPS</button>
                  <button class="filtro-btn" id="mf-rede" onclick="filtrarAppsRemoto('rede')">🟢 Em Trafego</button>
                  <button class="filtro-btn" id="mf-bloq" onclick="filtrarAppsRemoto('bloq')">🚫 Bloqueados</button>
                </div>
                <div class="app-list" id="modalListaApps"></div>
              </div>
            </div>

            <script>
              var memoriaSegura = {};
              function lerDado(chave, padrao) {
                try { var val = window.localStorage.getItem(chave); return val !== null ? val : padrao; }
                catch (e) { return memoriaSegura[chave] !== undefined ? memoriaSegura[chave] : padrao; }
              }
              function salvarDado(chave, valor) {
                memoriaSegura[chave] = String(valor);
                try { window.localStorage.setItem(chave, String(valor)); } catch (e) {}
              }

              var PREFIXO_MQTT = 'frota_josimar_2026_v6/aparelhos/';
              var PREFIXO_CMD = 'frota_josimar_2026_v6/comandos/';
              var clientMqtt = null;
              var frotaAparelhos = {};
              try { frotaAparelhos = JSON.parse(lerDado('frotaAparelhos_v6', '{}')) || {}; } catch (e) { frotaAparelhos = {}; }

              var aparelhoRemotoSelecionado = null;
              var filtroModalRemoto = 'todos';
              var planoSelecionadoNoModal = 0;

              function destacarBotoesPlanoModal(valorPlano) {
                planoSelecionadoNoModal = Number(valorPlano) || 0;
                var opcoes = [0, 43, 48, 91, 134];
                for (var i = 0; i < opcoes.length; i++) {
                  var btn = document.getElementById('mPlano-' + opcoes[i]);
                  if (btn) {
                    btn.classList.toggle('ativo', planoSelecionadoNoModal === opcoes[i]);
                  }
                }
              }

              function selecionarPlanoRemotoUI(novoGb) {
                destacarBotoesPlanoModal(novoGb);
                salvarPlanoCicloRemoto();
              }

              function ajustarDiaRemotoUI(delta) {
                var input = document.getElementById('modalInputDiaCiclo');
                var atual = parseInt(input.value || '1', 10) || 1;
                var novo = Math.max(1, Math.min(28, atual + delta));
                input.value = String(novo);
                salvarPlanoCicloRemoto();
              }

              function abrirMapaSeguro(lat, lon, nome) {
                var latitude = Number(lat || -3.7361);
                var longitude = Number(lon || -38.6531);
                var rotulo = nome || 'Aparelho Monitorado';
                if (typeof window.AndroidMonitor !== 'undefined' && window.AndroidMonitor.abrirMapaNativo) {
                  window.AndroidMonitor.abrirMapaNativo(latitude, longitude, rotulo);
                } else {
                  window.open('https://www.google.com/maps/search/?api=1&query=' + latitude + ',' + longitude, '_blank');
                }
              }

              function registrarAparelhoNaTela(payload) {
                if (!payload || !payload.deviceId) return;
                frotaAparelhos[payload.deviceId] = payload;
                salvarDado('frotaAparelhos_v6', JSON.stringify(frotaAparelhos));
                renderizarFrota();
                document.getElementById('statusCentral').textContent = '🟢 Ao Vivo (' + Object.keys(frotaAparelhos).length + ')';
                if (aparelhoRemotoSelecionado === payload.deviceId) { preencherModalRemoto(payload, true); }
              }

              function conectarMqttCentral() {
                try {
                  if (typeof mqtt === 'undefined') return;
                  if (clientMqtt) { try { clientMqtt.end(true); } catch (e) {} }
                  clientMqtt = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'central_' + Math.floor(Math.random() * 999999), clean: true, reconnectPeriod: 3000 });
                  clientMqtt.on('connect', function() {
                    document.getElementById('statusCentral').textContent = '🟢 Ao Vivo (' + Object.keys(frotaAparelhos).length + ')';
                    clientMqtt.subscribe(PREFIXO_MQTT + '+', { qos: 0 });
                  });
                  clientMqtt.on('message', function(topic, message) {
                    try {
                      var texto = message.toString();
                      if (!texto) return;
                      var payload = JSON.parse(texto);
                      if (payload && payload.deviceId) { registrarAparelhoNaTela(payload); }
                    } catch (e) {}
                  });
                } catch (e) {}
              }

              function salvarPlanoCicloRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                var novoPlano = Number(planoSelecionadoNoModal) || 0;
                var novoDia = Math.max(1, Math.min(28, parseInt(document.getElementById('modalInputDiaCiclo').value || '1', 10) || 1));
                document.getElementById('modalInputDiaCiclo').value = String(novoDia);

                d.planoGB = novoPlano;
                d.diaCiclo = novoDia;

                var comando = {
                  deviceId: d.deviceId,
                  acao: 'CONFIG_PLANO',
                  planoGB: novoPlano,
                  diaCiclo: novoDia,
                  timestamp: Date.now()
                };

                registrarAparelhoNaTela(d);

                if (clientMqtt && clientMqtt.connected) {
                  clientMqtt.publish(PREFIXO_CMD + d.deviceId, JSON.stringify(comando), { qos: 0, retain: true });
                  clientMqtt.publish(PREFIXO_MQTT + d.deviceId, JSON.stringify(d), { qos: 0, retain: true });
                }

                var av = document.getElementById('statusSalvoRemoto');
                var nomePlano = novoPlano > 0 ? (novoPlano + ' GB') : 'Ilimitado';
                av.textContent = '✅ ' + nomePlano + ' (Dia ' + novoDia + ') salvo!';
                setTimeout(function() { av.textContent = ''; }, 3000);
              }

              function zerarContadorRemoto() {
                if (!aparelhoRemotoSelecionado) return;
                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                if (!d) return;

                d.consumoGB = 0;
                var comando = {
                  deviceId: d.deviceId,
                  acao: 'ZERAR_CONTADOR',
                  timestamp: Date.now()
                };

                registrarAparelhoNaTela(d);

                if (clientMqtt && clientMqtt.connected) {
                  clientMqtt.publish(PREFIXO_CMD + d.deviceId, JSON.stringify(comando), { qos: 0, retain: true });
                  clientMqtt.publish(PREFIXO_MQTT + d.deviceId, JSON.stringify(d), { qos: 0, retain: true });
                }

                var av = document.getElementById('statusSalvoRemoto');
                av.textContent = '✅ Contador zerado!';
                setTimeout(function() { av.textContent = ''; }, 2500);
              }

              function alternarFirewallGeralAparelho(id) {
                var d = frotaAparelhos[id];
                if (!d) return;
                var bloquearAgora = !Boolean(d.dadosDesligados);
                var comando = { deviceId: id, acao: 'FIREWALL_GERAL', bloquear: bloquearAgora, timestamp: Date.now() };

                d.dadosDesligados = bloquearAgora;
                d.rede = bloquearAgora ? '🛡️ Apps Bloqueados' : '4G/5G Movel';
                if (bloquearAgora) d.velocidade = 0;

                if (d.apps && d.apps.length > 0) {
                  for (var i = 0; i < d.apps.length; i++) {
                    d.apps[i].bloqueado = bloquearAgora || Boolean(d.appsBloqueadosMap && d.appsBloqueadosMap[d.apps[i].pacote]);
                  }
                }
                registrarAparelhoNaTela(d);

                if (clientMqtt && clientMqtt.connected) {
                  clientMqtt.publish(PREFIXO_CMD + id, JSON.stringify(comando), { qos: 0, retain: true });
                  clientMqtt.publish(PREFIXO_MQTT + id, JSON.stringify(d), { qos: 0, retain: true });
                }
              }

              function alternarBloqueioAppIndividual(id, pacoteApp) {
                var d = frotaAparelhos[id];
                if (!d || !pacoteApp) return;
                if (!d.appsBloqueadosMap) d.appsBloqueadosMap = {};
                var bloquearApp = !Boolean(d.appsBloqueadosMap[pacoteApp]);

                if (bloquearApp) { d.appsBloqueadosMap[pacoteApp] = true; } else { delete d.appsBloqueadosMap[pacoteApp]; }

                if (d.apps && d.apps.length > 0) {
                  for (var i = 0; i < d.apps.length; i++) {
                    if (d.apps[i].pacote === pacoteApp) {
                      d.apps[i].bloqueado = Boolean(d.dadosDesligados) || bloquearApp;
                    }
                  }
                }

                var comando = { deviceId: id, acao: 'FIREWALL_APP', pacote: pacoteApp, bloquear: bloquearApp, timestamp: Date.now() };
                registrarAparelhoNaTela(d);

                if (clientMqtt && clientMqtt.connected) {
                  clientMqtt.publish(PREFIXO_CMD + id, JSON.stringify(comando), { qos: 0, retain: true });
                  clientMqtt.publish(PREFIXO_MQTT + id, JSON.stringify(d), { qos: 0, retain: true });
                }
              }

              function reconectarTudo() { document.getElementById('statusCentral').textContent = '🔄 Sincronizando...'; conectarMqttCentral(); renderizarFrota(); }
              function limparListaCentral() { frotaAparelhos = {}; salvarDado('frotaAparelhos_v6', '{}'); renderizarFrota(); }

              function simularAparelhoExtra() {
                var modelos = ['Samsung Galaxy A54', 'Motorola Moto G84', 'Xiaomi Redmi Note 13'];
                var idSim = 'CEL-' + Math.floor(Math.random() * 900 + 100);
                var pacoteTeste = {
                  deviceId: idSim, nome: modelos[Math.floor(Math.random() * modelos.length)] + ' • ' + idSim, timestamp: Date.now(),
                  consumoGB: 5.2, planoGB: 43, diaCiclo: 10, rede: '5G Ativo (Vivo)', dadosDesligados: false, appsBloqueadosMap: {}, velocidade: 45.5, latencia: 18,
                  cidade: 'Caucaia - CE', operadora: 'Vivo', lat: -3.7361, lon: -38.6531,
                  apps: [
                    { nome: 'WhatsApp', pacote: 'com.whatsapp', totalMB: 1420.5, redeAtiva: 'Transmitindo', emTransmissao: true, usaGeo: true, geoAtiva: true, bloqueado: false },
                    { nome: 'Instagram', pacote: 'com.instagram.android', totalMB: 2310.0, redeAtiva: 'Transmitindo', emTransmissao: true, usaGeo: true, geoAtiva: true, bloqueado: false }
                  ]
                };
                registrarAparelhoNaTela(pacoteTeste);
                if (clientMqtt && clientMqtt.connected) { clientMqtt.publish(PREFIXO_MQTT + idSim, JSON.stringify(pacoteTeste), { qos: 0, retain: true }); }
              }

              function renderizarFrota() {
                var chaves = Object.keys(frotaAparelhos);
                var lista = [];
                for (var i = 0; i < chaves.length; i++) { lista.push(frotaAparelhos[chaves[i]]); }
                lista.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });

                document.getElementById('resumoTotalAparelhos').textContent = String(lista.length);
                var onlineCount = 0, somaGB = 0, gpsCount = 0, agora = Date.now();

                for (var j = 0; j < lista.length; j++) {
                  var d = lista[j];
                  if (Math.floor((agora - (d.timestamp || 0)) / 1000) <= 90) onlineCount++;
                  somaGB += Number(d.consumoGB || 0);
                  if (d.lat && d.lon && (d.lat !== 0 || d.lon !== 0)) gpsCount++;
                }

                document.getElementById('resumoOnlineAgora').textContent = String(onlineCount);
                document.getElementById('resumoConsumoFrota').textContent = somaGB.toFixed(2) + ' GB';
                document.getElementById('resumoComGps').textContent = String(gpsCount);

                var container = document.getElementById('listaFrotaContainer');
                if (lista.length === 0) { container.innerHTML = '<div class="sub-info">Nenhum aparelho conectado ainda.</div>'; return; }

                container.innerHTML = lista.map(function(item) {
                  var diffSeg = Math.max(0, Math.floor((agora - (item.timestamp || 0)) / 1000));
                  var isOnline = diffSeg <= 90;
                  var bloqueado = Boolean(item.dadosDesligados);
                  var qtdBloqIndiv = (item.apps || []).filter(function(a) { return a.bloqueado; }).length;
                  var tempoTexto = bloqueado ? 'Apps Bloqueados' : (isOnline ? 'Online agora' : 'Offline');

                  var txtPlanoCard = Number(item.planoGB || 0) > 0 ? (item.planoGB + ' GB • Dia ' + (item.diaCiclo || 1)) : ('Ilimitado • Dia ' + (item.diaCiclo || 1));
                  var btnAppsHtml = bloqueado ? '<button class="btn-success" onclick="alternarFirewallGeralAparelho(\'' + item.deviceId + '\')">🟢 Liberar Apps</button>' : '<button class="btn-danger" onclick="alternarFirewallGeralAparelho(\'' + item.deviceId + '\')">🛡️ Bloquear Apps</button>';
                  var tagAppsInfo = qtdBloqIndiv > 0 ? '<span class="tag tag-net-block">🚫 ' + qtdBloqIndiv + ' apps bloqueados</span>' : '<span class="tag tag-net-on">📦 Apps liberados</span>';

                  return '<div class="device-card ' + (bloqueado ? 'bloqueado' : '') + '">' +
                    '<div class="device-header"><div><div class="device-name">📱 ' + item.nome + '</div><div class="app-pkg">ID: ' + item.deviceId + ' • Plano: ' + txtPlanoCard + '</div></div>' +
                    '<span class="status-dot ' + (bloqueado ? 'status-blocked' : (isOnline ? 'status-online' : 'status-offline')) + '">' + tempoTexto + '</span></div>' +
                    '<div class="grid-2"><div class="metric-box"><div class="metric-label">Consumo</div><div class="metric-val" style="color:var(--primary);">' + Number(item.consumoGB || 0).toFixed(2) + ' GB</div></div>' +
                    '<div class="metric-box"><div class="metric-label">Rede</div><div class="metric-val" style="font-size:0.88rem;">' + item.rede + '</div></div></div>' +
                    '<div class="app-badges" style="margin-top: 8px;"><span class="tag tag-geo-on">📍 ' + item.cidade + '</span>' + tagAppsInfo + '</div>' +
                    '<div class="device-actions"><button onclick="abrirModalRemoto(\'' + item.deviceId + '\')">🔍 Gerenciar Apps / Plano</button>' + btnAppsHtml + '</div></div>';
                }).join('');
              }

              function abrirModalRemoto(id) {
                var dados = frotaAparelhos[id];
                if (!dados) return;
                aparelhoRemotoSelecionado = id;
                filtroModalRemoto = 'todos';
                preencherModalRemoto(dados, false);
                document.getElementById('modalAparelhoRemoto').style.display = 'block';
              }

              function preencherModalRemoto(d, manterInputsAbertos) {
                document.getElementById('modalTituloAparelho').textContent = '📱 ' + d.nome;
                var txtPlano = Number(d.planoGB || 0) > 0 ? (d.planoGB + ' GB') : 'Ilimitado';
                document.getElementById('modalConsumoPlano').textContent = Number(d.consumoGB || 0).toFixed(2) + ' GB / ' + txtPlano + ' (Dia ' + (d.diaCiclo || 1) + ')';
                document.getElementById('modalRedePing').textContent = d.rede + ' • ' + d.latencia + ' ms';
                document.getElementById('modalCidadeOp').textContent = d.cidade + ' (' + d.operadora + ')';
                document.getElementById('modalCoordsGps').textContent = Number(d.lat || 0).toFixed(4) + ', ' + Number(d.lon || 0).toFixed(4);

                destacarBotoesPlanoModal(d.planoGB || 0);
                if (!manterInputsAbertos) {
                  document.getElementById('modalInputDiaCiclo').value = String(d.diaCiclo || 1);
                }

                document.getElementById('btnAbrirMapaModal').onclick = function() {
                  abrirMapaSeguro(d.lat, d.lon, d.nome);
                };

                var btnToggle = document.getElementById('btnToggleDadosModal');
                btnToggle.textContent = d.dadosDesligados ? '🟢 Liberar Todos' : '🛡️ Bloquear Todos';
                btnToggle.className = d.dadosDesligados ? 'btn-success' : 'btn-danger';
                btnToggle.onclick = function() { alternarFirewallGeralAparelho(d.deviceId); };
                filtrarAppsRemoto(filtroModalRemoto);
              }

              function filtrarAppsRemoto(filtro) {
                filtroModalRemoto = filtro;
                document.getElementById('mf-todos').classList.toggle('ativo', filtro === 'todos');
                document.getElementById('mf-geo').classList.toggle('ativo', filtro === 'geo');
                document.getElementById('mf-rede').classList.toggle('ativo', filtro === 'rede');
                document.getElementById('mf-bloq').classList.toggle('ativo', filtro === 'bloq');

                var d = frotaAparelhos[aparelhoRemotoSelecionado];
                var lista = d ? (d.apps || []) : [];
                renderizarListaAppsRemoto(lista, filtro, d);
              }

              function renderizarListaAppsRemoto(listaBase, filtro, dadosAparelho) {
                var container = document.getElementById('modalListaApps');
                var filtrados = listaBase || [];

                if (filtro === 'geo') { filtrados = filtrados.filter(function(a) { return a.usaGeo; }); }
                else if (filtro === 'rede') { filtrados = filtrados.filter(function(a) { return !a.bloqueado && a.emTransmissao; }); }
                else if (filtro === 'bloq') { filtrados = filtrados.filter(function(a) { return a.bloqueado; }); }

                document.getElementById('modalContadorApps').textContent = filtrados.length + ' apps';
                if (filtrados.length === 0) { container.innerHTML = '<div class="sub-info">Nenhum aplicativo listado.</div>'; return; }

                var devId = dadosAparelho ? dadosAparelho.deviceId : '';
                container.innerHTML = filtrados.map(function(app) {
                  var estaBloq = Boolean(app.bloqueado) || Boolean(dadosAparelho && dadosAparelho.dadosDesligados);
                  var btnAppHtml = estaBloq ? '<button class="btn-success btn-app-lock" onclick="alternarBloqueioAppIndividual(\'' + devId + '\', \'' + app.pacote + '\')">🟢 Liberar</button>' : '<button class="btn-danger btn-app-lock" onclick="alternarBloqueioAppIndividual(\'' + devId + '\', \'' + app.pacote + '\')">🚫 Bloquear</button>';
                  return '<div class="app-item ' + (estaBloq ? 'app-bloqueado' : '') + '">' +
                    '<div class="app-main"><div class="app-nome">' + app.nome + '</div><div class="app-pkg">' + app.pacote + '</div>' +
                    '<div class="app-badges">' + (estaBloq ? '<span class="tag tag-net-block">🚫 Bloqueado</span>' : '<span class="tag tag-net-on">🟢 Liberado</span>') + '</div></div>' +
                    '<div class="app-right"><div class="app-consumo">' + app.totalMB + ' MB</div>' + btnAppHtml + '</div></div>';
                }).join('');
              }

              function fecharModalRemoto() { aparelhoRemotoSelecionado = null; document.getElementById('modalAparelhoRemoto').style.display = 'none'; }

              renderizarFrota();
              conectarMqttCentral();
              setInterval(renderizarFrota, 5000);
            </script>
          </body>
          </html>
          EOF

          # ===================================================================
          # 5. CONFIGURACOES DO GRADLE
          # ===================================================================
          echo "sdk.dir=$HOME/android-sdk" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorFrota"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.monitordados'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 23
                  targetSdk 33
                  versionCode 7
                  versionName "7.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: 5. Compilar APK 1 - Monitor de Dados
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Monitor-Dados.apk

      - name: 6. Compilar APK 2 - Painel Central
        run: |
          cp app/src/main/assets/central.html app/src/main/assets/index.html

          sed -i 's/applicationId "com.example.monitordados"/applicationId "com.example.painelcentral"/g' app/build.gradle
          sed -i 's/android:label="Monitor de Dados"/android:label="Painel Central"/g' app/src/main/AndroidManifest.xml

          export ANDROID_HOME=$HOME/android-sdk
          /tmp/gradle-7.6.4/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk APKs-Prontos/Painel-Central.apk

      - name: 7. Publicar os 2 APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Monitor-e-Central
          path: APKs-Prontos/*.apk
