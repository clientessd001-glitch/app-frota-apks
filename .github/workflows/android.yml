              var deviceId = lerDado('deviceId_v6', '');
              if (!deviceId) {
                deviceId = 'CEL-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                salvarDado('deviceId_v6', deviceId);
              }

              function detectarModeloAparelho() {
                var salvo = lerDado('nomeAparelho_v6', '');
                if (salvo) return salvo;
                var ua = navigator.userAgent || '';
                var modelo = 'Android';
                var matchAndroid = ua.match(/;\s*([^;)]+)\s+Build\//i);
                if (matchAndroid && matchAndroid[1]) { modelo = matchAndroid[1].trim(); }
                var nomeGerado = modelo + ' • ' + deviceId;
                salvarDado('nomeAparelho_v6', nomeGerado);
                return nomeGerado;
              }

              var nomeAparelho = detectarModeloAparelho();
              document.getElementById('statusNuvemTopo').textContent = '☁️ ID: ' + deviceId + ' (Sincronizando...)';
              document.getElementById('inputDiaCiclo').value = String(diaCiclo);

